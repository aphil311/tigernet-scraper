[project]
name = "tigernet-scraper"
version = "0.1.0"
description = "Simple web scraper for TigerNet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.24.1",
    "playwright>=1.40.0",
    "black>=26.3.1",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
tigernet-scraper = "tigernet_scraper.main:app"
